<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e2a23">
<title>清迈 + 普吉岛 · 10日旅行手册</title>
<style>
  :root{
    --bg:#f6f1e7; --panel:#fffdf8; --ink:#2b2620; --sub:#7a7164;
    --line:#e7ddc9; --accent:#c4612f; --accent2:#2e8b57; --shadow:0 6px 20px rgba(60,45,20,.10);
    --map-bg:#fbf6ea; --soft:#f0e8d6; --warn:#b5482e;
  }
  html[data-theme="dark"]{
    --bg:#10171a; --panel:#16212a; --ink:#eef2f0; --sub:#9fb0ad;
    --line:#26343d; --accent:#e8915a; --accent2:#5fcf93; --shadow:0 6px 22px rgba(0,0,0,.45);
    --map-bg:#0f1a1b; --soft:#1c2a31; --warn:#ff8a6b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.55; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:760px;margin:0 auto;padding:14px 14px 60px}
  header.top{
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    padding:10px 4px 6px;
  }
  header.top h1{font-size:20px;margin:0;letter-spacing:.5px}
  .thclock{font-size:12px;color:var(--sub);text-align:right;line-height:1.3}
  .thclock b{color:var(--accent);font-variant-numeric:tabular-nums}
  .themebtn{
    border:1px solid var(--line);background:var(--panel);color:var(--ink);
    border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;
  }
  section{margin-top:18px}
  .sec-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;margin:0 0 10px;padding-left:4px}
  .sec-title .num{display:inline-flex;width:24px;height:24px;border-radius:7px;background:var(--accent);color:#fff;align-items:center;justify-content:center;font-size:13px}

  /* 此刻关注 卡片 */
  .nowcard{
    background:linear-gradient(135deg,var(--accent),#a84d22);color:#fff;border-radius:18px;
    padding:18px 18px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden;
  }
  html[data-theme="dark"] .nowcard{background:linear-gradient(135deg,#7d3c18,#5a2c12)}
  .nowcard .label{font-size:13px;opacity:.92;letter-spacing:1px}
  .nowcard .evt{font-size:19px;font-weight:800;margin:4px 0 10px;line-height:1.3}
  .cd{display:flex;gap:8px;text-align:center}
  .cd .u{flex:1;background:rgba(255,255,255,.16);border-radius:12px;padding:8px 4px}
  .cd .u .v{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .cd .u .k{font-size:11px;opacity:.85;margin-top:4px}
  .nowcard .meta{margin-top:10px;font-size:12px;opacity:.92;line-height:1.5}
  .nowcard .meta b{font-weight:700}
  .tzbadge{display:inline-block;background:rgba(255,255,255,.2);border-radius:6px;padding:1px 7px;font-size:11px;margin-left:4px}
  .pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:#7CFC9A;margin-right:6px;animation:pulse 1.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(124,252,154,.7)}70%{box-shadow:0 0 0 9px rgba(124,252,154,0)}100%{box-shadow:0 0 0 0 rgba(124,252,154,0)}}

  /* 总览地图 */
  .mapbox{background:var(--map-bg);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:var(--shadow)}
  .mapbox svg{width:100%;height:auto;display:block}
  .maplegend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12px;color:var(--sub)}
  .maplegend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .pin{cursor:pointer}
  .pin text{font-size:11px;fill:var(--ink);paint-order:stroke;stroke:var(--map-bg);stroke-width:3px}
  html[data-theme="dark"] .pin text{stroke:var(--map-bg)}

  /* 卡片通用 */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
  .book{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
  .book:last-child{border-bottom:0}
  .book .ic{font-size:20px;flex:0 0 auto;width:28px;text-align:center}
  .book .b-main{flex:1}
  .book .b-t{font-weight:700;font-size:15px}
  .book .b-d{font-size:13px;color:var(--sub);margin-top:2px}
  .book .b-d a{color:var(--accent);text-decoration:none;word-break:break-all}
  .tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:1px}
  .tag.ok{background:rgba(46,139,87,.15);color:var(--accent2)}
  .tag.todo{background:rgba(181,72,46,.15);color:var(--warn)}
  .need{font-size:12px;color:var(--warn);margin-top:2px}

  /* 逐日 */
  details.day{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
  details.day>summary{
    list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;
    font-weight:700;font-size:15px;
  }
  details.day>summary::-webkit-details-marker{display:none}
  details.day>summary .dot{width:14px;height:14px;border-radius:50%;flex:0 0 auto}
  details.day>summary .arrow{margin-left:auto;transition:transform .2s;color:var(--sub)}
  details.day[open]>summary .arrow{transform:rotate(90deg)}
  .daymeta{font-size:12px;color:var(--sub);font-weight:400}
  .daybody{padding:4px 14px 14px}
  .stay{font-size:13px;background:var(--soft);border-radius:9px;padding:7px 10px;margin:4px 0 10px}
  .stay b{color:var(--accent)}
  .timeline{position:relative;margin:0;padding:0 0 0 64px}
  .ti{position:relative;padding:8px 0 8px 0}
  .ti .tm{position:absolute;left:-64px;top:8px;width:54px;text-align:right;font-size:13px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
  .ti::before{content:"";position:absolute;left:-14px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--panel)}
  .ti::after{content:"";position:absolute;left:-10.5px;top:22px;bottom:-8px;width:2px;background:var(--line)}
  .ti:last-child::after{display:none}
  .ti .cv{font-size:14.5px}
  .ti .cv a{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--accent)}
  .ti .bk{display:inline-block;font-size:11px;border-radius:6px;background:rgba(196,97,47,.14);color:var(--accent);padding:1px 7px;margin-left:6px;font-weight:700}
  .ti .bk.paid{background:rgba(46,139,87,.16);color:var(--accent2)}
  .ti .note{font-size:12.5px;color:var(--sub);margin-top:2px}
  .daynav{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .daymap{margin-top:10px;background:var(--map-bg);border:1px solid var(--line);border-radius:12px;padding:8px}
  .daymap svg{width:100%;height:auto;display:block}

  /* 待办 */
  ul.todo{list-style:none;margin:0;padding:0}
  ul.todo li{padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel);font-size:14px;display:flex;gap:9px;align-items:flex-start}
  ul.todo li .mk{color:var(--accent2);font-weight:800}
  ul.todo li .sub{display:block;font-size:12px;color:var(--sub)}

  /* 贴士 */
  .tips{display:grid;grid-template-columns:1fr;gap:10px}
  .tip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
  .tip h4{margin:0 0 5px;font-size:14.5px;display:flex;gap:7px;align-items:center}
  .tip p{margin:0;font-size:13px;color:var(--sub)}
  .foot{margin-top:26px;text-align:center;font-size:12px;color:var(--sub)}

  /* 飞行动画线 */
  .fly{stroke-dasharray:6 7;animation:dash 1.2s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-26}}
  .nodata{font-size:13px;color:var(--warn);background:rgba(181,72,46,.08);border:1px dashed var(--warn);border-radius:10px;padding:10px 12px}
</style>
</head>

  </section>

  <!-- 4. 逐日行程 -->
  <section id="days">
    <div class="sec-title"><span class="num">4</span> 逐日行程</div>
    <div id="dayList"></div>
  </section>

  <!-- 5. 待办清单 -->
  <section id="todo">
    <div class="sec-title"><span class="num">5</span> 待办清单</div>
    <ul class="todo" id="todoList"></ul>
    <div class="need" style="margin-top:6px">办完一项告诉我，我帮你把那一行划掉。</div>
  </section>

  <!-- 6. 实用贴士 -->
  <section id="tips">
    <div class="sec-title"><span class="num">6</span> 实用贴士</div>
    <div class="tips" id="tipsList"></div>
  </section>

  <div class="foot">本手册为单文件离线网页 · 任何手机浏览器直接打开即可 · 时间均带时区，跨时区不会算错</div>
</div>

/* ===================== 工具函数 ===================== */
function toUTC(o){ return new Date(Date.UTC(o.y,o.m-1,o.d,o.h - o.tz,o.mi)); }
function pad(n){ return String(n).padStart(2,'0'); }
// 把 UTC 瞬间按某时区偏移格式化为字符串
function fmtTZ(utc, off){
  const d = new Date(utc.getTime() + off*3600*1000);
  return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`;
}
function fmtTimeTZ(utc, off){
  const d = new Date(utc.getTime() + off*3600*1000);
  return `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`;
}
function gmaps(q){ return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q); }
function enc(s){ return encodeURIComponent(s); }

/* ===================== 1. 此刻关注 + 倒计时 ===================== */
function buildEvents(){
  const evs = [];
  FLIGHTS.forEach(f=>{
    evs.push({ts:toUTC(f.dep), title:f.title, kind:'flight', f});
  });
  DAYS.forEach(d=>{
    d.items.forEach(it=>{
      if(!it.time) return;
      const [h,mi] = it.time.split(':').map(Number);
      const off = it.tz!=null ? it.tz : TH_TZ;
      const dt = d.date.split('-');
      const ts = new Date(Date.UTC(+dt[0], +dt[1]-1, +dt[2], h - off, mi));
      evs.push({ts, title:`D${d.day} ${it.label}`, kind:'act', day:d.day});
    });
  });
  evs.sort((a,b)=>a.ts - b.ts);
  return evs;
}
const EVENTS = buildEvents();

function tickNow(){
  const now = new Date();
  // 泰国时钟
  document.getElementById('thclock').textContent = fmtTimeTZ(now, TH_TZ);
  // 下一个事件
  let next = null;
  for(const e of EVENTS){ if(e.ts > now){ next = e; break; } }
  const elE = document.getElementById('nowEvt');
  const elM = document.getElementById('nowMeta');
  if(!next){
    elE.textContent = '🏠 旅程已结束，欢迎回家';
    document.getElementById('nowLabel').textContent = '行程全部完成';
    document.getElementById('cdD').textContent='00';document.getElementById('cdH').textContent='00';
    document.getElementById('cdM').textContent='00';document.getElementById('cdS').textContent='00';
    elM.innerHTML = '这趟清迈 + 普吉岛 10 日圆满收官。';
    return;
  }
  elE.textContent = next.title;
  const diff = next.ts - now;
  const s = Math.floor(diff/1000);
  const dd = Math.floor(s/86400), hh = Math.floor((s%86400)/3600), mm = Math.floor((s%3600)/60), ss = s%60;
  document.getElementById('cdD').textContent=pad(dd);
  document.getElementById('cdH').textContent=pad(hh);
  document.getElementById('cdM').textContent=pad(mm);
  document.getElementById('cdS').textContent=pad(ss);
  // 时区信息
  let meta = '';
  if(next.kind==='flight'){
    const f = next.f;
    meta = `<b>起飞</b> ${fmtTZ(toUTC(f.dep), f.dep.tz)} <span class="tzbadge">当地 UTC+${f.dep.tz}</span><br>`;
    meta += `<b>到达</b> ${fmtTZ(toUTC(f.arr), f.arr.tz)} <span class="tzbadge">当地 UTC+${f.arr.tz}</span><br>`;
  } else {
    const off = TH_TZ;
    meta = `<b>时间</b> ${fmtTZ(next.ts, off)} <span class="tzbadge">泰国 UTC+${off}</span><br>`;
  }
  meta += `你所在时区显示：${next.ts.toLocaleString('zh-CN',{hour12:false})} <span class="tzbadge" id="locTz"></span>`;
  elM.innerHTML = meta;
  const tzo = -new Date().getTimezoneOffset()/60;
  const tzEl = document.getElementById('locTz');
  if(tzEl) tzEl.textContent = '当地 UTC' + (tzo>=0?'+':'') + tzo;
}

function dayNavUrl(day){
  const qs = day.items.filter(i=>i.q).map(i=>i.q);
  if(qs.length<2) return gmaps(qs[0]||day.city);
  const origin=qs[0], dest=qs[qs.length-1], wps=qs.slice(1,-1);
  let url = 'https://www.google.com/maps/dir/?api=1&travelmode=driving&origin='+enc(origin)+'&destination='+enc(dest);
  if(wps.length) url += '&waypoints='+enc(wps.join('|'));
  return url;
}
function renderDays(){
  const wrap = document.getElementById('dayList');
  let h='';
  DAYS.forEach(d=>{
    const col = DAY_COLORS[d.day-1];
    let tl='';
    d.items.forEach(it=>{
      const tm = it.time ? `<div class="tm">${it.time}</div>` : `<div class="tm" style="font-size:11px;color:var(--sub)">—</div>`;
      let bk='';
      if(it.book){
        const paid = /已付|定金/.test(it.book);
        bk = `<span class="bk${paid?' paid':''}">${it.book}</span>`;
      }
      const cv = it.place ? `<a href="${gmaps(it.q||it.place)}" target="_blank" rel="noopener">${it.label}</a>` : it.label;
      const note = it.note ? `<div class="note">⚠ ${it.note}</div>` : '';
      tl += `<div class="ti">${tm}<div class="cv">${cv}${bk}</div>${note}</div>`;
    });
    h += `<details class="day"${d.day===1?' open':''}>
      <summary><span class="dot" style="background:${col}"></span>
        <span>D${d.day} · ${d.date} · ${d.city}</span>
        <span class="daymeta">${d.items.filter(i=>i.time).length} 个定时安排</span>
        <span class="arrow">▶</span>
      </summary>
      <div class="daybody">
        <div class="stay">🛏 当晚住：<b>${d.stay}</b></div>
        <div class="timeline">${tl}</div>
        <div class="daynav">
          <a class="btn primary" href="${dayNavUrl(d)}" target="_blank" rel="noopener">🧭 一键打开全天导航</a>
          <a class="btn" href="${gmaps(d.city==='清迈'?'Chiang Mai':'Phuket')}" target="_blank" rel="noopener">📍 ${d.city}总览</a>

function renderDayMap(d){
  const el = document.getElementById('daymap'+d.day);
  if(!el) return;
  const r = DAY_ROUTES[d.day]; const col = DAY_COLORS[d.day-1];
  const pts = (r||[]).map(k=>MAP_PLACES[k]).filter(Boolean);
  if(!pts.length) return;
  // 计算包围盒，留白
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  const minX=Math.min(...xs)-40, maxX=Math.max(...xs)+40, minY=Math.min(...ys)-30, maxY=Math.max(...ys)+30;
  const W=560, vbX=minX, vbY=minY, vbW=maxX-minX, vbH=maxY-minY;
  let s='';
  if(pts.length>=2){
    let dd='M'; pts.forEach((p,i)=>{ dd+=(i?' L':' ')+p.x+' '+p.y; });
    s+=`<path d="${dd}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
  } else {
    s+=`<circle cx="${pts[0].x}" cy="${pts[0].y}" r="16" fill="none" stroke="${col}" stroke-width="2.5" stroke-dasharray="4 4"/>`;
  }
  pts.forEach(p=>{
    s+=`<g class="pin" data-q="${enc(p.name)}"><circle cx="${p.x}" cy="${p.y}" r="6" fill="${col}"/><text x="${p.x+9}" y="${p.y+4}" font-size="12" fill="var(--ink)">${p.name}</text></g>`;
  });
  el.innerHTML = `<svg viewBox="${vbX} ${vbY} ${vbW} ${vbH}" style="width:100%;height:auto;background:var(--map-bg);border-radius:8px">${s}</svg>`;
  el.querySelectorAll('.pin').forEach(g=>{ g.style.cursor='pointer'; g.addEventListener('click',()=>window.open(gmaps(decodeURIComponent(g.getAttribute('data-q'))),'_blank')); });
}

/* ===================== 主题：白天/黑夜自动 ===================== */
function applyTheme(){
  const saved = localStorage.getItem('theme');
  const root = document.documentElement;
  if(saved==='light'||saved==='dark'){ root.setAttribute('data-theme',saved); return; }
  // 自动：按当地小时 6:00–17:59 为白天
  const hr = new Date().getHours();
  root.setAttribute('data-theme', (hr>=6 && hr<18) ? 'light' : 'dark');
  // 也尊重系统偏好（若用户未手动设置）
  if(window.matchMedia){
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    mq.addEventListener('change', ()=>{ if(!localStorage.getItem('theme')) applyTheme(); });
  }
}
document.getElementById('themeBtn').addEventListener('click',()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('theme',next);
});
